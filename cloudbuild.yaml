substitutions:
  _SERVICE_NAME: sfkit-website
  _CORS_ORIGINS: ""
  _DATABASE_NAME: sfkit
  _DATABASE_REGION: us-central1
  _STORAGE_REGION: us-central1
  _RESULTS_BUCKET: $PROJECT_ID-sfkit
  _TF_STATE_BUCKET: $PROJECT_ID-terraform
  _FLASK_DEBUG: "0"
  _OIDC_AUDIENCE: "" # Typically, OAuth client ID
  _OIDC_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
  _IMAGE: $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    script: >-
      docker buildx create --use --driver docker-container &&
      docker buildx build --push -t $_IMAGE:$SHORT_SHA
      --cache-from type=registry,ref=$_IMAGE:cache
      --cache-to type=registry,ref=$_IMAGE:cache,mode=max
      --build-arg APP_VERSION=$SHORT_SHA
      --build-arg BUILD_VERSION=$SHORT_SHA .

  - id: tf-init
    name: hashicorp/terraform
    waitFor: ["-"]
    dir: terraform
    args:
      - init
      - -backend-config=bucket=$_TF_STATE_BUCKET

  - name: hashicorp/terraform
    dir: terraform
    args:
      - apply
      - -auto-approve
      - -var=project_id=$PROJECT_ID
      - -var=image=$_IMAGE:$SHORT_SHA
      - -var=cors_origins=$_CORS_ORIGINS
      - -var=service_name=$_SERVICE_NAME
      - -var=database_name=$_DATABASE_NAME
      - -var=database_region=$_DATABASE_REGION
      - -var=storage_region=$_STORAGE_REGION
      - -var=results_bucket=$_RESULTS_BUCKET
      - -var=flask_debug=$_FLASK_DEBUG
      - -var=oidc_audience=$_OIDC_AUDIENCE
      - -var=oidc_jwks_url=$_OIDC_JWKS_URL
