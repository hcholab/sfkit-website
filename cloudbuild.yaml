substitutions:
  _SERVICE_NAME: sfkit-website
  _GCR_HOSTNAME: us.gcr.io
  _CORS_ORIGINS: ""
  _DATABASE_NAME: sfkit
  _DATABASE_REGION: us-central1
  _STORAGE_REGION: us-central1
  _RESULTS_BUCKET: $PROJECT_ID-sfkit
  _TF_STATE_BUCKET: $PROJECT_ID-terraform
  _FLASK_DEBUG: "0"
  _OIDC_AUDIENCE: "" # Typically, OAuth client ID
  _OIDC_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: python@sha256:739e7213785e88c0f702dcdc12c0973afcbd606dbf021a589cab77d6b00b579d # 3.13-slim
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt -r requirements-dev.txt
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        python -m pytest

  - name: gcr.io/k8s-skaffold/pack
    args:
      - build
      - $_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$SHORT_SHA
      - --builder=gcr.io/buildpacks/builder:google-24
      - --publish

  - name: hashicorp/terraform
    dir: terraform
    args:
      - init
      - -backend-config=bucket=$_TF_STATE_BUCKET

  - name: hashicorp/terraform
    dir: terraform
    args:
      - apply
      - -auto-approve
      - -var=project_id=$PROJECT_ID
      - -var=image=$_GCR_HOSTNAME/$PROJECT_ID/$REPO_NAME/$_SERVICE_NAME:$SHORT_SHA
      - -var=cors_origins=$_CORS_ORIGINS
      - -var=service_name=$_SERVICE_NAME
      - -var=database_name=$_DATABASE_NAME
      - -var=database_region=$_DATABASE_REGION
      - -var=storage_region=$_STORAGE_REGION
      - -var=results_bucket=$_RESULTS_BUCKET
      - -var=flask_debug=$_FLASK_DEBUG
      - -var=oidc_audience=$_OIDC_AUDIENCE
      - -var=oidc_jwks_url=$_OIDC_JWKS_URL
